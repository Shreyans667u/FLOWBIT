<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowbit — Visual Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0e;
    --bg-canvas: #0b0b10;
    --panel: #111116;
    --panel-2: #16161d;
    --border: #23232c;
    --border-soft: #1b1b22;
    --text: #eceef3;
    --text-dim: #8b8c98;
    --text-faint: #55565f;

    --event: #ffb454;
    --event-soft: rgba(255,180,84,.14);
    --action: #4da3ff;
    --action-soft: rgba(77,163,255,.14);
    --logic: #b98cff;
    --logic-soft: rgba(185,140,255,.14);
    --var: #33e2b0;
    --var-soft: rgba(51,226,176,.14);
    --note: #ffd76e;
    --note-soft: rgba(255,215,110,.14);
    --danger: #ff5d72;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Top bar ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    height:54px;
    min-height:54px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    width:20px;height:20px;border-radius:6px;
    background:linear-gradient(135deg,var(--action),var(--logic));
    box-shadow:0 0 14px rgba(77,163,255,.45);
  }
  .brand h1{
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:0;
    letter-spacing:.2px;
  }
  .brand p{
    margin:0;
    font-size:11.5px;
    color:var(--text-dim);
  }
  .top-actions{display:flex;align-items:center;gap:8px;}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    display:flex;
    align-items:center;
    gap:7px;
    transition:filter .12s ease, transform .08s ease;
    white-space:nowrap;
  }
  button:hover{filter:brightness(1.18);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  #runBtn{
    background:linear-gradient(135deg,#1fce8f,#0fae76);
    border-color:transparent;
    color:#04140d;
    font-weight:600;
  }
  #runBtn:hover{filter:brightness(1.08);}
  #stopBtn{
    background:rgba(255,93,114,.12);
    border-color:rgba(255,93,114,.35);
    color:#ff8b9a;
  }
  #clearBtn{color:var(--text-dim);}

  /* ---------- Secondary toolbar ---------- */
  .toolbar2{
    display:flex;
    align-items:center;
    gap:8px;
    height:44px;
    min-height:44px;
    padding:0 18px;
    background:var(--panel-2);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    z-index:19;
  }
  .toolbar2 button{
    padding:6px 11px;
    font-size:12px;
  }
  .toolbar2 .sep{
    width:1px;height:20px;
    background:var(--border);
    margin:0 4px;
    flex-shrink:0;
  }
  .toolbar2 .speed-wrap{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11.5px;
    color:var(--text-dim);
    margin-left:auto;
    flex-shrink:0;
    padding-left:10px;
  }
  .toolbar2 input[type=range]{
    width:100px;
    accent-color:var(--action);
  }
  .toolbar2 .speed-val{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);
    min-width:30px;
  }
  .toolbar2 .save-indicator{
    font-size:11px;
    color:var(--text-faint);
    min-width:0;
  }

  /* ---------- Body layout ---------- */
  .body-wrap{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---------- Palette ---------- */
  aside.palette{
    width:216px;
    min-width:216px;
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px 12px 30px;
  }
  .palette h2{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-faint);
    margin:16px 4px 8px;
    font-weight:600;
  }
  .palette h2:first-child{margin-top:4px;}
  .pal-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    margin-bottom:6px;
    border-radius:9px;
    border:1px solid var(--border-soft);
    background:var(--panel-2);
    font-size:12.5px;
    font-weight:500;
    cursor:grab;
    user-select:none;
    transition:border-color .12s ease, background .12s ease;
  }
  .pal-item:hover{background:#1b1b23;}
  .pal-item:active{cursor:grabbing;}
  .pal-bar{width:4px;align-self:stretch;border-radius:3px;min-height:16px;}
  .cat-event .pal-bar, .node.cat-event{--accent:var(--event);}
  .cat-action .pal-bar, .node.cat-action{--accent:var(--action);}
  .cat-logic .pal-bar, .node.cat-logic{--accent:var(--logic);}
  .cat-variable .pal-bar, .node.cat-variable{--accent:var(--var);}
  .cat-note .pal-bar, .node.cat-note{--accent:var(--note);}

  .hint{
    margin:18px 4px 0;
    font-size:11px;
    line-height:1.5;
    color:var(--text-faint);
  }

  /* ---------- Canvas ---------- */
  main.canvas-wrap{
    flex:1;
    position:relative;
    overflow:hidden;
    background:var(--bg-canvas);
    cursor:grab;
  }
  main.canvas-wrap.panning{cursor:grabbing;}
  #canvasContent{
    position:absolute;
    top:0;left:0;
    width:4000px;
    height:3000px;
    transform-origin:0 0;
    background-image:radial-gradient(circle, #1c1c26 1px, transparent 1px);
    background-size:26px 26px;
    background-position:0 0;
  }
  #wiresLayer{
    position:absolute;top:0;left:0;
    width:4000px;height:3000px;
    overflow:visible;
    pointer-events:none;
  }
  #nodesLayer{
    position:absolute;top:0;left:0;
    width:4000px;height:3000px;
  }
  .canvas-float-btn{
    position:absolute;
    right:16px;
    bottom:16px;
    z-index:6;
    padding:8px 13px;
    font-size:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }

  /* ---------- Node ---------- */
  .node{
    position:absolute;
    min-width:196px;
    background:linear-gradient(180deg,#151519,#111115);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    user-select:none;
    z-index:2;
  }
  .node.cat-note{
    border-style:dashed;
    background:linear-gradient(180deg,#1a1710,#141209);
  }
  .node.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 0 22px -2px var(--accent), 0 6px 18px rgba(0,0,0,.4);
  }
  .node.active{
    box-shadow:0 0 0 1px var(--accent), 0 0 28px 2px var(--accent), 0 6px 18px rgba(0,0,0,.4);
    animation:pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.35);}
  }
  .node-head{
    padding:9px 12px;
    font-family:'Sora',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    cursor:move;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .node-body{
    padding:0 12px 11px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-row label{
    font-size:11px;
    color:var(--text-dim);
    min-width:38px;
  }
  .field-row input, .field-row select, .field-row textarea{
    flex:1;
    min-width:0;
    background:#0c0c10;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-size:12px;
    font-family:'Inter',sans-serif;
    padding:5px 7px;
    outline:none;
  }
  .field-row textarea{
    min-height:56px;
    resize:vertical;
    line-height:1.4;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus{border-color:var(--accent);}
  .node-close{
    width:16px;height:16px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-faint);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }
  .node-close:hover{color:var(--danger);}

  /* ports */
  .port{
    position:absolute;
    width:13px;height:13px;
    border-radius:50%;
    background:#0c0c10;
    border:2px solid var(--accent);
    cursor:crosshair;
    z-index:3;
  }
  .port:hover{box-shadow:0 0 0 5px rgba(255,255,255,.08);}
  .port-in{left:-7px;top:50%;transform:translateY(-50%);}
  .port-out{right:-7px;}
  .port-label{
    position:absolute;
    font-size:9px;
    color:var(--text-faint);
    white-space:nowrap;
    top:50%;
    transform:translateY(-50%);
  }
  .port-out .port-label{right:16px;}

  /* wires */
  .wire{
    fill:none;
    stroke-width:2.4;
    cursor:pointer;
    pointer-events:stroke;
  }
  .wire.selected{stroke-width:3.4; filter:drop-shadow(0 0 6px currentColor);}
  .wire-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer;}
  .temp-wire{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:5 4;pointer-events:none;}

  /* ---------- Right panel ---------- */
  aside.right-panel{
    width:296px;
    min-width:296px;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .panel-section{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .panel-section h2{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-faint);
    margin:0 0 10px;
    font-weight:600;
  }
  #stage{
    position:relative;
    height:160px;
    border-radius:10px;
    background:
      radial-gradient(circle at 30% 20%, rgba(77,163,255,.06), transparent 60%),
      #0c0c11;
    border:1px solid var(--border-soft);
    overflow:hidden;
  }
  #sprite{
    position:absolute;
    bottom:16px;
    left:16px;
    width:26px;height:26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7ad4ff, #2f7fe0);
    box-shadow:0 0 16px rgba(77,163,255,.55);
    transition:left .35s ease;
  }
  #speechBubble{
    position:absolute;
    bottom:48px;
    left:16px;
    max-width:200px;
    background:#1c1c24;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px 9px;
    font-size:11.5px;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .18s ease, transform .18s ease, left .35s ease;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #speechBubble.show{opacity:1;transform:translateY(0);}

  #varsList{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:110px;
    overflow-y:auto;
  }
  .var-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    background:#0c0c11;
    border:1px solid var(--border-soft);
    border-radius:6px;
    padding:6px 9px;
  }
  .var-row .vname{color:var(--var);font-weight:500;}
  .var-row .vval{color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .empty-note{font-size:11.5px;color:var(--text-faint);}

  .console-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding:14px 16px;
  }
  #console{
    flex:1;
    overflow-y:auto;
    background:#0a0a0e;
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:10px 11px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    line-height:1.6;
  }
  #console .line{color:var(--text-dim);}
  #console .line.evt{color:var(--event);}
  #console .line.act{color:#bcd9ff;}
  #console .line.var{color:var(--var);}
  #console .line.err{color:var(--danger);}
  #console .line .t{color:var(--text-faint); margin-right:6px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#222229;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Flowbit</h1>
        <p>Drag blocks. Wire them together. Press Run.</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="clearBtn">Clear</button>
      <button id="stopBtn" disabled>■ Stop</button>
      <button id="runBtn">▶ Run</button>
    </div>
  </header>

  <div class="toolbar2">
    <button id="undoBtn" title="Undo (Ctrl+Z)">↺ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↻ Redo</button>
    <div class="sep"></div>
    <button id="saveBtn" title="Save to this browser">Save</button>
    <button id="loadBtn" title="Load saved project">Load</button>
    <button id="exportBtn" title="Download as a .json file">Export</button>
    <button id="importBtn" title="Import a .json file">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="sep"></div>
    <button id="duplicateBtn" title="Duplicate selected node (Ctrl+D)">⧉ Duplicate</button>
    <span class="save-indicator" id="saveIndicator"></span>
    <div class="speed-wrap">
      <span>Speed</span>
      <input type="range" id="speedSlider" min="0.5" max="3" step="0.5" value="1">
      <span class="speed-val" id="speedVal">1x</span>
    </div>
  </div>

  <div class="body-wrap">

    <aside class="palette" id="palette"></aside>

    <main class="canvas-wrap" id="canvasWrap">
      <div id="canvasContent">
        <svg id="wiresLayer"></svg>
        <div id="nodesLayer"></div>
      </div>
      <button class="canvas-float-btn" id="fitBtn" title="Zoom to fit all blocks">⤢ Fit to screen</button>
    </main>

    <aside class="right-panel">
      <div class="panel-section">
        <h2>Stage</h2>
        <div id="stage">
          <div id="speechBubble"></div>
          <div id="sprite"></div>
        </div>
      </div>
      <div class="panel-section">
        <h2>Variables</h2>
        <div id="varsList"><div class="empty-note">No variables yet.</div></div>
      </div>
      <div class="console-wrap">
        <h2 style="font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin:0 0 10px;font-weight:600;">Console</h2>
        <div id="console"><div class="line">Ready. Press Run to execute the graph.</div></div>
      </div>
    </aside>

  </div>
</div>

<script>
(function(){
"use strict";

/* ============================= NODE DEFINITIONS ============================= */
const NODE_DEFS = {
  event: {
    category:'event', title:'When Clicked', paletteLabel:'When Clicked',
    fields:[], hasInput:false,
    outputs:[{key:'out', label:''}]
  },
  say: {
    category:'action', title:'Say', paletteLabel:'Say',
    fields:[{key:'text', type:'text', label:'Text', default:'Hello!'}],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  move: {
    category:'action', title:'Move', paletteLabel:'Move',
    fields:[{key:'steps', type:'number', label:'Steps', default:10}],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  wait: {
    category:'action', title:'Wait', paletteLabel:'Wait',
    fields:[{key:'secs', type:'number', label:'Secs', default:1, step:0.1, min:0}],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  setvar: {
    category:'variable', title:'Set Variable', paletteLabel:'Set Variable',
    fields:[
      {key:'name', type:'text', label:'Name', default:'score'},
      {key:'value', type:'text', label:'To', default:'0'}
    ],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  changevar: {
    category:'variable', title:'Change Variable', paletteLabel:'Change Variable',
    fields:[
      {key:'name', type:'text', label:'Name', default:'score'},
      {key:'delta', type:'number', label:'By', default:1}
    ],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  mathop: {
    category:'variable', title:'Math', paletteLabel:'Math',
    fields:[
      {key:'resultVar', type:'text', label:'Set', default:'result'},
      {key:'a', type:'text', label:'', default:'0'},
      {key:'op', type:'select', label:'', options:['+','-','\u00d7','\u00f7','mod'], default:'+'},
      {key:'b', type:'text', label:'', default:'0'}
    ],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  randomnum: {
    category:'variable', title:'Random Number', paletteLabel:'Random Number',
    fields:[
      {key:'resultVar', type:'text', label:'Set', default:'rand'},
      {key:'min', type:'number', label:'Min', default:1},
      {key:'max', type:'number', label:'Max', default:10}
    ],
    hasInput:true, outputs:[{key:'out', label:''}]
  },
  ifelse: {
    category:'logic', title:'If / Else', paletteLabel:'If / Else',
    fields:[
      {key:'left', type:'text', label:'If', default:'score'},
      {key:'op', type:'select', label:'', options:['>','<','=','\u2260'], default:'>'},
      {key:'right', type:'text', label:'', default:'0'}
    ],
    hasInput:true,
    outputs:[{key:'true', label:'True'},{key:'false', label:'False'}]
  },
  repeat: {
    category:'logic', title:'Repeat', paletteLabel:'Repeat',
    fields:[{key:'count', type:'number', label:'Times', default:3, min:1, max:50}],
    hasInput:true,
    outputs:[{key:'body', label:'Loop'},{key:'done', label:'Done'}]
  },
  whileloop: {
    category:'logic', title:'While', paletteLabel:'While',
    fields:[
      {key:'left', type:'text', label:'While', default:'score'},
      {key:'op', type:'select', label:'', options:['>','<','=','\u2260'], default:'<'},
      {key:'right', type:'text', label:'', default:'10'}
    ],
    hasInput:true,
    outputs:[{key:'body', label:'Loop'},{key:'done', label:'Done'}]
  },
  forever: {
    category:'logic', title:'Forever', paletteLabel:'Forever',
    fields:[], hasInput:true,
    outputs:[{key:'body', label:'Loop'},{key:'done', label:'Done'}]
  },
  breakloop: {
    category:'logic', title:'Break Loop', paletteLabel:'Break Loop',
    fields:[], hasInput:true,
    outputs:[]
  },
  comment: {
    category:'note', title:'Note', paletteLabel:'Note',
    fields:[{key:'text', type:'textarea', label:'', default:'Write a note\u2026'}],
    hasInput:false, outputs:[]
  }
};

const CATEGORY_LABELS = {event:'Events', action:'Actions', logic:'Logic', variable:'Variables', note:'Notes'};
const CATEGORY_ORDER = ['event','action','logic','variable','note'];

/* ============================= STATE ============================= */
let nodes = [];      // {id,type,x,y,data:{}}
let edges = [];      // {id,from,fromPort,to}
let nodeEls = {};    // id -> DOM el
let selectedNodeId = null;
let selectedEdgeId = null;
let idCounter = 1;
let scale = 1, panX = 220, panY = 140;
let running = false;
let stopRequested = false;
let vars = {};
let spritePos = 16;
const STAGE_MAX = 220;
let speedMultiplier = 1;
let clipboardNode = null;
let pasteOffset = 24;
let undoStack = [];
let redoStack = [];

const canvasWrap = document.getElementById('canvasWrap');
const canvasContent = document.getElementById('canvasContent');
const nodesLayer = document.getElementById('nodesLayer');
const wiresLayer = document.getElementById('wiresLayer');
const paletteEl = document.getElementById('palette');
const consoleEl = document.getElementById('console');
const varsListEl = document.getElementById('varsList');
const spriteEl = document.getElementById('sprite');
const bubbleEl = document.getElementById('speechBubble');
const runBtn = document.getElementById('runBtn');
const stopBtn = document.getElementById('stopBtn');
const clearBtn = document.getElementById('clearBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const saveBtn = document.getElementById('saveBtn');
const loadBtn = document.getElementById('loadBtn');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const duplicateBtn = document.getElementById('duplicateBtn');
const saveIndicator = document.getElementById('saveIndicator');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const fitBtn = document.getElementById('fitBtn');

function uid(prefix){ return prefix + (idCounter++); }
function applyTransform(){
  canvasContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
applyTransform();

/* ============================= PALETTE ============================= */
CATEGORY_ORDER.forEach(cat=>{
  const h = document.createElement('h2');
  h.textContent = CATEGORY_LABELS[cat];
  paletteEl.appendChild(h);
  Object.entries(NODE_DEFS).forEach(([type,def])=>{
    if(def.category !== cat) return;
    const item = document.createElement('div');
    item.className = `pal-item cat-${cat}`;
    item.innerHTML = `<span class="pal-bar"></span><span>${def.paletteLabel}</span>`;
    item.addEventListener('pointerdown', (e)=> startPaletteDrag(e, type));
    paletteEl.appendChild(item);
  });
});
const hint = document.createElement('p');
hint.className = 'hint';
hint.textContent = 'Drag a block onto the canvas, then drag from a dot on its edge to another block\u2019s dot to connect them. Scroll to zoom, drag empty space to pan.';
paletteEl.appendChild(hint);

let paletteDrag = null;
function startPaletteDrag(e, type){
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = `node cat-${NODE_DEFS[type].category}`;
  ghost.style.position='fixed';
  ghost.style.pointerEvents='none';
  ghost.style.opacity='0.85';
  ghost.style.zIndex=999;
  ghost.style.width='190px';
  ghost.innerHTML = `<div class="node-head"><span>${NODE_DEFS[type].title}</span></div>`;
  document.body.appendChild(ghost);
  paletteDrag = {type, ghost};
  positionGhost(e.clientX, e.clientY);
  window.addEventListener('pointermove', onPaletteDragMove);
  window.addEventListener('pointerup', onPaletteDragEnd);
}
function positionGhost(x,y){
  paletteDrag.ghost.style.left = (x+8)+'px';
  paletteDrag.ghost.style.top = (y+8)+'px';
}
function onPaletteDragMove(e){ positionGhost(e.clientX, e.clientY); }
function onPaletteDragEnd(e){
  window.removeEventListener('pointermove', onPaletteDragMove);
  window.removeEventListener('pointerup', onPaletteDragEnd);
  const wrapRect = canvasWrap.getBoundingClientRect();
  if(e.clientX>wrapRect.left && e.clientX<wrapRect.right && e.clientY>wrapRect.top && e.clientY<wrapRect.bottom){
    const pt = canvasPointFromClient(e.clientX, e.clientY);
    pushHistory();
    const n = createNode(paletteDrag.type, pt.x-90, pt.y-24);
    selectNode(n.id);
  }
  paletteDrag.ghost.remove();
  paletteDrag = null;
}

/* ============================= COORD HELPERS ============================= */
function canvasPointFromClient(clientX, clientY){
  const rect = canvasContent.getBoundingClientRect();
  return { x:(clientX-rect.left)/scale, y:(clientY-rect.top)/scale };
}

/* ============================= NODE CREATION / RENDER ============================= */
function createNode(type, x, y){
  const def = NODE_DEFS[type];
  const data = {};
  def.fields.forEach(f=> data[f.key]=f.default);
  const node = { id: uid('n'), type, x, y, data };
  nodes.push(node);
  renderNode(node);
  return node;
}

function renderNode(node){
  const def = NODE_DEFS[node.type];
  const el = document.createElement('div');
  el.className = `node cat-${def.category}`;
  el.style.left = node.x+'px';
  el.style.top = node.y+'px';
  el.dataset.id = node.id;

  const head = document.createElement('div');
  head.className = 'node-head';
  head.innerHTML = `<span>${def.title}</span><span class="node-close" title="Delete">\u2715</span>`;
  head.addEventListener('pointerdown', (e)=>{
    if(e.target.classList.contains('node-close')) return;
    startNodeDrag(e, node);
  });
  head.querySelector('.node-close').addEventListener('pointerdown', e=>{
    e.stopPropagation();
    deleteNode(node.id);
  });
  el.appendChild(head);

  if(def.fields.length){
    const body = document.createElement('div');
    body.className = 'node-body';
    def.fields.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'field-row';
      if(f.label) row.innerHTML = `<label>${f.label}</label>`;
      let input;
      if(f.type==='select'){
        input = document.createElement('select');
        f.options.forEach(o=>{
          const opt = document.createElement('option');
          opt.value=o; opt.textContent=o;
          if(o===node.data[f.key]) opt.selected=true;
          input.appendChild(opt);
        });
      } else if(f.type==='textarea'){
        input = document.createElement('textarea');
        input.rows = 3;
        input.value = node.data[f.key];
      } else {
        input = document.createElement('input');
        input.type = f.type==='number' ? 'number' : 'text';
        if(f.step!==undefined) input.step=f.step;
        if(f.min!==undefined) input.min=f.min;
        if(f.max!==undefined) input.max=f.max;
        input.value = node.data[f.key];
      }
      input.addEventListener('pointerdown', e=>e.stopPropagation());
      let historyArmed = true;
      input.addEventListener('focus', ()=>{ historyArmed = true; });
      input.addEventListener('change', ()=>{
        if(historyArmed){ pushHistory(); historyArmed = false; }
        node.data[f.key] = f.type==='number' ? parseFloat(input.value)||0 : input.value;
      });
      row.appendChild(input);
      body.appendChild(row);
    });
    el.appendChild(body);
  } else {
    const spacer = document.createElement('div');
    spacer.style.height='4px';
    el.appendChild(spacer);
  }

  if(def.hasInput){
    const p = document.createElement('div');
    p.className='port port-in';
    p.dataset.node=node.id; p.dataset.port='in';
    el.appendChild(p);
    attachPortEvents(p, node.id, 'in', true);
  }

  const outCount = def.outputs.length;
  def.outputs.forEach((o,i)=>{
    const p = document.createElement('div');
    p.className='port port-out';
    p.dataset.node=node.id; p.dataset.port=o.key;
    const pct = outCount===1 ? 50 : (i===0?32:68);
    p.style.top = pct+'%';
    p.style.transform='translateY(-50%)';
    el.appendChild(p);
    if(o.label){
      const lbl = document.createElement('div');
      lbl.className='port-label';
      lbl.style.left='calc(100% + 3px)';
      lbl.style.top = pct+'%';
      lbl.textContent = o.label;
      el.appendChild(lbl);
    }
    attachPortEvents(p, node.id, o.key, false);
  });

  el.addEventListener('pointerdown', ()=> selectNode(node.id));

  nodesLayer.appendChild(el);
  nodeEls[node.id] = el;
}

function syncFieldsToDOM(node){
  const def = NODE_DEFS[node.type];
  const el = nodeEls[node.id];
  if(!el) return;
  const inputs = el.querySelectorAll('.field-row input, .field-row select, .field-row textarea');
  def.fields.forEach((f,i)=>{ if(inputs[i]) inputs[i].value = node.data[f.key]; });
}

function deleteNode(id){
  pushHistory();
  nodes = nodes.filter(n=>n.id!==id);
  edges = edges.filter(e=> e.from!==id && e.to!==id);
  if(nodeEls[id]){ nodeEls[id].remove(); delete nodeEls[id]; }
  if(selectedNodeId===id) selectedNodeId=null;
  drawWires();
}

function selectNode(id){
  if(selectedNodeId && nodeEls[selectedNodeId]) nodeEls[selectedNodeId].classList.remove('selected');
  selectedNodeId = id;
  selectedEdgeId = null;
  if(id && nodeEls[id]) nodeEls[id].classList.add('selected');
  drawWires();
}

/* ============================= NODE DRAG ============================= */
let dragCtx = null;
function startNodeDrag(e, node){
  e.stopPropagation();
  selectNode(node.id);
  const start = canvasPointFromClient(e.clientX, e.clientY);
  dragCtx = { node, offX: start.x-node.x, offY: start.y-node.y, pointerId:e.pointerId, historyPushed:false };
  window.addEventListener('pointermove', onNodeDragMove);
  window.addEventListener('pointerup', onNodeDragEnd);
}
function onNodeDragMove(e){
  if(!dragCtx) return;
  if(!dragCtx.historyPushed){ pushHistory(); dragCtx.historyPushed = true; }
  const p = canvasPointFromClient(e.clientX, e.clientY);
  dragCtx.node.x = p.x - dragCtx.offX;
  dragCtx.node.y = p.y - dragCtx.offY;
  const el = nodeEls[dragCtx.node.id];
  el.style.left = dragCtx.node.x+'px';
  el.style.top = dragCtx.node.y+'px';
  drawWires();
}
function onNodeDragEnd(){
  dragCtx = null;
  window.removeEventListener('pointermove', onNodeDragMove);
  window.removeEventListener('pointerup', onNodeDragEnd);
}

/* ============================= WIRE CREATION ============================= */
let wireDrag = null;
function attachPortEvents(portEl, nodeId, portKey, isInput){
  portEl.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    if(isInput) return; // wires start from outputs only
    const rect = portEl.getBoundingClientRect();
    const start = canvasPointFromClient(rect.left+rect.width/2, rect.top+rect.height/2);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','temp-wire');
    wiresLayer.appendChild(path);
    wireDrag = { fromNode:nodeId, fromPort:portKey, start, path };
    window.addEventListener('pointermove', onWireDragMove);
    window.addEventListener('pointerup', onWireDragEnd);
  });
}
function bezier(x1,y1,x2,y2){
  const dx = Math.max(60, Math.abs(x2-x1)*0.5);
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}
function onWireDragMove(e){
  if(!wireDrag) return;
  const p = canvasPointFromClient(e.clientX, e.clientY);
  wireDrag.path.setAttribute('d', bezier(wireDrag.start.x, wireDrag.start.y, p.x, p.y));
}
function onWireDragEnd(e){
  window.removeEventListener('pointermove', onWireDragMove);
  window.removeEventListener('pointerup', onWireDragEnd);
  if(!wireDrag) return;
  const target = document.elementFromPoint(e.clientX, e.clientY);
  wireDrag.path.remove();
  if(target && target.classList.contains('port-in')){
    const toNode = target.dataset.node;
    if(toNode !== wireDrag.fromNode){
      pushHistory();
      edges = edges.filter(ed => !(ed.to===toNode) && !(ed.from===wireDrag.fromNode && ed.fromPort===wireDrag.fromPort));
      edges.push({ id: uid('e'), from: wireDrag.fromNode, fromPort: wireDrag.fromPort, to: toNode });
      drawWires();
    }
  }
  wireDrag = null;
}

/* ============================= WIRE RENDERING ============================= */
const CAT_COLOR = { event:'#ffb454', action:'#4da3ff', logic:'#b98cff', variable:'#33e2b0', note:'#ffd76e' };
function portCenter(nodeId, portKey){
  const el = nodeEls[nodeId];
  if(!el) return null;
  const sel = portKey==='in' ? '.port-in' : `.port-out[data-port="${portKey}"]`;
  const portEl = el.querySelector(sel);
  if(!portEl) return null;
  const r = portEl.getBoundingClientRect();
  return canvasPointFromClient(r.left+r.width/2, r.top+r.height/2);
}
function drawWires(){
  wiresLayer.innerHTML = '';
  edges.forEach(edge=>{
    const a = portCenter(edge.from, edge.fromPort);
    const b = portCenter(edge.to, 'in');
    if(!a||!b) return;
    const node = nodes.find(n=>n.id===edge.from);
    if(!node) return;
    const color = CAT_COLOR[NODE_DEFS[node.type].category] || '#888';
    const d = bezier(a.x,a.y,b.x,b.y);

    const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d', d);
    hit.setAttribute('class','wire-hit');
    hit.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); selectEdge(edge.id); });
    wiresLayer.appendChild(hit);

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class','wire'+(edge.id===selectedEdgeId?' selected':''));
    path.setAttribute('stroke', color);
    path.style.color = color;
    if(edge.id===selectedEdgeId) path.style.filter = `drop-shadow(0 0 6px ${color})`;
    wiresLayer.appendChild(path);
  });
}
function selectEdge(id){
  selectedEdgeId = id;
  if(selectedNodeId && nodeEls[selectedNodeId]) nodeEls[selectedNodeId].classList.remove('selected');
  selectedNodeId = null;
  drawWires();
}

/* ============================= PAN + ZOOM ============================= */
let panCtx = null;
canvasWrap.addEventListener('pointerdown', (e)=>{
  if(e.target !== canvasWrap && e.target !== canvasContent) return;
  selectNode(null); selectedEdgeId=null; drawWires();
  panCtx = { startX:e.clientX, startY:e.clientY, panX0:panX, panY0:panY };
  canvasWrap.classList.add('panning');
  window.addEventListener('pointermove', onPanMove);
  window.addEventListener('pointerup', onPanEnd);
});
function onPanMove(e){
  if(!panCtx) return;
  panX = panCtx.panX0 + (e.clientX-panCtx.startX);
  panY = panCtx.panY0 + (e.clientY-panCtx.startY);
  applyTransform();
}
function onPanEnd(){
  panCtx=null;
  canvasWrap.classList.remove('panning');
  window.removeEventListener('pointermove', onPanMove);
  window.removeEventListener('pointerup', onPanEnd);
}
canvasWrap.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
  const pointX = (cx-panX)/scale, pointY=(cy-panY)/scale;
  const factor = e.deltaY<0 ? 1.08 : 0.93;
  const newScale = Math.min(1.8, Math.max(0.5, scale*factor));
  panX = cx - pointX*newScale;
  panY = cy - pointY*newScale;
  scale = newScale;
  applyTransform();
}, {passive:false});

function zoomToFit(){
  if(!nodes.length) return;
  const rects = nodes.map(n=>{
    const el = nodeEls[n.id];
    const w = el ? el.offsetWidth : 196, h = el ? el.offsetHeight : 60;
    return {x:n.x, y:n.y, w, h};
  });
  const minX = Math.min(...rects.map(r=>r.x));
  const minY = Math.min(...rects.map(r=>r.y));
  const maxX = Math.max(...rects.map(r=>r.x+r.w));
  const maxY = Math.max(...rects.map(r=>r.y+r.h));
  const wrapRect = canvasWrap.getBoundingClientRect();
  const pad = 70;
  const contentW = Math.max(1, maxX-minX+pad*2);
  const contentH = Math.max(1, maxY-minY+pad*2);
  const newScale = Math.min(1.4, Math.max(0.3, Math.min(wrapRect.width/contentW, wrapRect.height/contentH)));
  scale = newScale;
  panX = -minX*scale + pad*scale + (wrapRect.width - contentW*scale)/2;
  panY = -minY*scale + pad*scale + (wrapRect.height - contentH*scale)/2;
  applyTransform();
}
fitBtn.addEventListener('click', zoomToFit);

/* ============================= UNDO / REDO ============================= */
function snapshot(){
  return JSON.stringify({
    nodes: nodes.map(n=>({id:n.id, type:n.type, x:n.x, y:n.y, data:{...n.data}})),
    edges: edges.map(e=>({...e})),
    idCounter
  });
}
function pushHistory(){
  undoStack.push(snapshot());
  if(undoStack.length>60) undoStack.shift();
  redoStack = [];
}
function applySnapshot(json){
  const state = JSON.parse(json);
  nodes = state.nodes.map(n=>({id:n.id, type:n.type, x:n.x, y:n.y, data:{...n.data}}));
  edges = state.edges.map(e=>({...e}));
  idCounter = state.idCounter || idCounter;
  rebuildCanvas();
}
function rebuildCanvas(){
  nodesLayer.innerHTML = '';
  nodeEls = {};
  nodes.forEach(renderNode);
  selectedNodeId = null;
  selectedEdgeId = null;
  drawWires();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  const prev = undoStack.pop();
  applySnapshot(prev);
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  const next = redoStack.pop();
  applySnapshot(next);
}
undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);

/* ============================= COPY / PASTE / DUPLICATE ============================= */
function copySelected(){
  const n = nodes.find(x=>x.id===selectedNodeId);
  if(!n) return;
  clipboardNode = {type:n.type, data:{...n.data}, x:n.x, y:n.y};
  pasteOffset = 24;
}
function pasteClipboard(){
  if(!clipboardNode) return;
  pushHistory();
  const n = createNode(clipboardNode.type, clipboardNode.x+pasteOffset, clipboardNode.y+pasteOffset);
  n.data = {...clipboardNode.data};
  syncFieldsToDOM(n);
  selectNode(n.id);
  pasteOffset += 24;
}
function duplicateSelected(){
  const n = nodes.find(x=>x.id===selectedNodeId);
  if(!n) return;
  pushHistory();
  const nn = createNode(n.type, n.x+24, n.y+24);
  nn.data = {...n.data};
  syncFieldsToDOM(nn);
  selectNode(nn.id);
}
duplicateBtn.addEventListener('click', duplicateSelected);

/* ============================= KEYBOARD ============================= */
window.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  const editing = tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA';
  const meta = e.ctrlKey || e.metaKey;

  if(meta && !editing){
    if(e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if((e.key.toLowerCase()==='z' && e.shiftKey) || e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(e.key.toLowerCase()==='c'){ e.preventDefault(); copySelected(); return; }
    if(e.key.toLowerCase()==='v'){ e.preventDefault(); pasteClipboard(); return; }
    if(e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSelected(); return; }
  }
  if(editing) return;
  if(e.key==='Delete' || e.key==='Backspace'){
    if(selectedNodeId){ deleteNode(selectedNodeId); selectedNodeId=null; }
    else if(selectedEdgeId){ pushHistory(); edges = edges.filter(ed=>ed.id!==selectedEdgeId); selectedEdgeId=null; drawWires(); }
  }
  if(e.key==='Escape'){ selectNode(null); selectedEdgeId=null; drawWires(); }
});

/* ============================= PERSISTENCE ============================= */
function serializeProject(){
  return JSON.stringify({
    nodes: nodes.map(n=>({id:n.id, type:n.type, x:n.x, y:n.y, data:{...n.data}})),
    edges: edges.map(e=>({...e})),
    idCounter
  }, null, 2);
}
function flashSaveIndicator(msg){
  saveIndicator.textContent = msg;
  clearTimeout(flashSaveIndicator._t);
  flashSaveIndicator._t = setTimeout(()=>{ saveIndicator.textContent=''; }, 2500);
}
function loadProjectData(jsonStr){
  try{
    const state = JSON.parse(jsonStr);
    if(!Array.isArray(state.nodes) || !Array.isArray(state.edges)) throw new Error('bad shape');
    pushHistory();
    nodes = state.nodes;
    edges = state.edges;
    idCounter = state.idCounter || (Math.max(0,...nodes.map(n=>parseInt((n.id||'n0').replace(/\D/g,''))||0))+1);
    rebuildCanvas();
    flashSaveIndicator('Loaded');
  } catch(err){
    flashSaveIndicator('Could not read that file');
  }
}
saveBtn.addEventListener('click', ()=>{
  localStorage.setItem('flowbit_project', serializeProject());
  flashSaveIndicator('Saved to this browser');
});
loadBtn.addEventListener('click', ()=>{

  if(!raw){ flashSaveIndicator('No saved project found'); return; }
  loadProjectData(raw);
});
exportBtn.addEventListener('click', ()=>{

importBtn.addEventListener('click', ()=> importFile.click());
importFile.addEventListener('change', ()=>{

/* ============================= EXECUTION ENGINE ============================= */
class BreakSignal{}
function rawSleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
function sleep(ms){ return rawSleep(ms/speedMultiplier); }
function findEdge(fromId, portKey){ return edges.find(e=>e.from===fromId && e.fromPort===portKey); }
function resolveVal(token){
  if(token===undefined || token==='') return '';
  const t = String(token).trim();
  if(Object.prototype.hasOwnProperty.call(vars, t)) return vars[t];
  const n = Number(t);
  if(!isNaN(n) && t!=='') return n;
  return t;
}
function compare(l,op,r){
  const ln = Number(l), rn = Number(r);
  const bothNum = !isNaN(ln) && !isNaN(rn);
  const L = bothNum?ln:l, R = bothNum?rn:r;
  switch(op){
    case '>': return L>R;
    case '<': return L<R;
    case '=': return L==R;
    case '\u2260': return L!=R;
  }
  return false;
}
function mathCompute(a,op,b){
  const A = Number(a), B = Number(b);
  switch(op){
    case '+': return A+B;
    case '-': return A-B;
    case '\u00d7': return A*B;
    case '\u00f7': return B===0 ? NaN : A/B;
    case 'mod': return B===0 ? NaN : A%B;
  }
  return NaN;
}

const STEP_MS = 380;
let stepGuard = 0;
const STEP_LIMIT = 4000;

async function highlight(node){
  const el = nodeEls[node.id];
  if(el) el.classList.add('active');
}
function unhighlight(node){
  const el = nodeEls[node.id];
  if(el) el.classList.remove('active');
}

async function runLoopBody(bodyStartId){
  try{
    if(bodyStartId) await runChain(bodyStartId);
    return true;
  } catch(e){
    if(e instanceof BreakSignal) return false;
    throw e;
  }
}

async function runChain(startNodeId){
  let currentId = startNodeId;
  while(currentId){
    if(stopRequested) return;
    if(++stepGuard > STEP_LIMIT){ log('Stopped: too many steps (possible infinite loop).','err'); return; }
    const node = nodes.find(n=>n.id===currentId);
    if(!node) return;
    await highlight(node);
    await sleep(STEP_MS*0.35);

    let nextId = null;

    if(node.type==='say'){
      log(`Say: \u201c${node.data.text}\u201d`, 'act');
      showBubble(node.data.text);
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='move'){
      log(`Move ${node.data.steps} steps`, 'act');
      moveSprite(Number(node.data.steps)||0);
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='wait'){
      log(`Wait ${node.data.secs}s`, 'act');
      unhighlight(node);
      await sleep(Math.max(0,Number(node.data.secs)||0)*1000);
      await highlight(node);
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='setvar'){
      vars[node.data.name] = resolveVal(node.data.value);
      updateVarsPanel();
      log(`Set ${node.data.name} = ${vars[node.data.name]}`, 'var');
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='changevar'){
      const cur = Number(vars[node.data.name])||0;
      vars[node.data.name] = cur + (Number(node.data.delta)||0);
      updateVarsPanel();
      log(`Change ${node.data.name} by ${node.data.delta} \u2192 ${vars[node.data.name]}`, 'var');
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='mathop'){
      const a = resolveVal(node.data.a), b = resolveVal(node.data.b);
      const res = mathCompute(a, node.data.op, b);
      vars[node.data.resultVar] = res;
      updateVarsPanel();
      log(`Math: ${node.data.resultVar} = ${node.data.a} ${node.data.op} ${node.data.b} = ${res}`, 'var');
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='randomnum'){
      const lo = Math.min(Number(node.data.min),Number(node.data.max));
      const hi = Math.max(Number(node.data.min),Number(node.data.max));
      const rnd = Math.floor(Math.random()*(hi-lo+1))+lo;
      vars[node.data.resultVar] = rnd;
      updateVarsPanel();
      log(`Random: ${node.data.resultVar} = ${rnd}`, 'var');
      nextId = findEdge(node.id,'out')?.to;
    } else if(node.type==='ifelse'){
      const l = resolveVal(node.data.left), r = resolveVal(node.data.right);
      const result = compare(l, node.data.op, r);
      log(`If ${node.data.left} ${node.data.op} ${node.data.right} \u2192 ${result}`, 'var');
      nextId = findEdge(node.id, result?'true':'false')?.to;
    } else if(node.type==='repeat'){
      const count = Math.max(1, Math.min(50, Number(node.data.count)||1));
      log(`Repeat ${count} times`, 'var');
      const bodyStart = findEdge(node.id,'body')?.to;
      for(let i=0;i<count;i++){
        if(stopRequested) return;
        const keepGoing = await runLoopBody(bodyStart);
        if(!keepGoing) break;
      }
      nextId = findEdge(node.id,'done')?.to;
    } else if(node.type==='whileloop'){
      const bodyStart = findEdge(node.id,'body')?.to;
      let guardCount = 0;
      log(`While ${node.data.left} ${node.data.op} ${node.data.right}`, 'var');
      while(!stopRequested && compare(resolveVal(node.data.left), node.data.op, resolveVal(node.data.right))){
        if(++stepGuard > STEP_LIMIT){ log('Stopped: too many steps (possible infinite loop).','err'); break; }
        if(++guardCount > 1000){ log('While loop stopped after 1000 iterations (safety limit).','err'); break; }
        if(!bodyStart) break;
        const keepGoing = await runLoopBody(bodyStart);
        if(!keepGoing) break;
      }
      nextId = findEdge(node.id,'done')?.to;
    } else if(node.type==='forever'){
      const bodyStart = findEdge(node.id,'body')?.to;
      if(!bodyStart){
        log('Forever loop has an empty Loop branch \u2014 stopping.','err');
      } else {
        log('Forever loop started (press Stop to end it)', 'var');
        while(!stopRequested){
          if(++stepGuard > STEP_LIMIT){ log('Stopped: too many steps (possible infinite loop).','err'); break; }
          const keepGoing = await runLoopBody(bodyStart);
          if(!keepGoing) break;
        }
      }
      nextId = findEdge(node.id,'done')?.to;
    } else if(node.type==='breakloop'){
      unhighlight(node);
      throw new BreakSignal();
    } else if(node.type==='event'){
      nextId = findEdge(node.id,'out')?.to;
    }

    unhighlight(node);
    await sleep(STEP_MS*0.25);
    currentId = nextId;
  }
}

async function runProgram(){
  if(running) return;
  const events = nodes.filter(n=>n.type==='event');
  if(!events.length){ log('Add a \u201cWhen Clicked\u201d block to start.', 'err'); return; }
  running = true;
  stopRequested = false;
  stepGuard = 0;
  vars = {};
  spritePos = 16;
  spriteEl.style.left='16px';
  bubbleEl.classList.remove('show');
  clearConsole();
  updateVarsPanel();
  runBtn.disabled = true;
  stopBtn.disabled = false;
  for(const ev of events){
    if(stopRequested) break;
    log('\u25b6 Program started', 'evt');
    try{
      await runChain(ev.id);
    } catch(e){
      if(e instanceof BreakSignal) log('Break Loop used outside of a loop \u2014 ignored.', 'err');
      else throw e;
    }
  }
  if(!stopRequested) log('\u25a0 Finished', 'evt');
  else log('\u25a0 Stopped', 'err');
  running = false;
  runBtn.disabled = false;
  stopBtn.disabled = true;
}

runBtn.addEventListener('click', runProgram);
stopBtn.addEventListener('click', ()=>{ stopRequested = true; });
clearBtn.addEventListener('click', ()=>{
  if(running) return;
  if(!nodes.length || confirm('Clear the whole canvas?')){
    pushHistory();
    nodes=[]; edges=[]; nodesLayer.innerHTML=''; nodeEls={}; selectedNodeId=null; selectedEdgeId=null;
    drawWires();
  }
});
